name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ ^(feat|fix|docs|refactor|test|chore|perf|build|ci|style|revert)(\([a-z0-9-]+\))?!?:[[:space:]]+.+$ ]]; then
              echo "Commit without Conventional Commits format: $subject"
              exit 1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")

      - name: Check for secrets
        run: bash scripts/check-secrets.sh

  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program
    env:
      SOLANA_VERSION: "3.1.10"
      ANCHOR_VERSION: "1.2.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: program/yarn.lock

      - name: Cache Solana, Cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            ~/.cargo/git
            program/target
            !program/target/deploy
          key: program-${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('program/Cargo.lock') }}

      - name: Install the Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install the Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: rustc --version && solana --version && anchor --version

      # A throwaway wallet for the local validator. Never a real key.
      - name: Create a local test wallet
        run: solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      # Builds SBPF v0 and runs the tests on solana-test-validator.
      - name: Build and test
        run: yarn test:local

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the price parsers and rules
        run: node data/refresh-prices.mjs --self-test

  app-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
