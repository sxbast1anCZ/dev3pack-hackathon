name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ ^(feat|fix|docs|refactor|test|chore|perf|build|ci|style|revert)(\([a-z0-9-]+\))?!?:[[:space:]]+.+$ ]]; then
              echo "Commit without Conventional Commits format: $subject"
              exit 1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")

      - name: Check for secrets
        run: bash scripts/check-secrets.sh

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the price parsers and rules
        run: node data/refresh-prices.mjs --self-test

# Build and test jobs for the other lanes (program, agent, web) are added when each is scaffolded.
